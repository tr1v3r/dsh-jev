name: CI

on:
  push:
    branches: [main]
  pull_request:

# Explicit official registry (global ~/.npmrc may point to an internal mirror;
# the project .npmrc already pins this, and this env var makes it explicit in CI).
env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org

jobs:
  ci:
    name: node-${{ matrix.node-version }} (ubuntu-latest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pnpm 11 uses node:sqlite (added in node 22.5), so node 20 is not testable
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version is read from the packageManager field in package.json.

      - name: Show effective npm registry
        run: pnpm config get registry

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build must precede typecheck: dependent packages resolve @dsh-jev/core
      # types from its emitted dist/index.d.ts (topological order: core first).
      - name: Build
        run: pnpm -r run build

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Test
        run: pnpm -r run test

      - name: Upload coverage summary
        if: matrix.node-version == 22
        run: |
          echo "## Vitest coverage summary" >> "$GITHUB_STEP_SUMMARY"
          find packages -name 'coverage-summary.json' -print -exec cat '{}' \; >> "$GITHUB_STEP_SUMMARY" || true
